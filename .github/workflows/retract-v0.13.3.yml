name: Retract premature 0.13.3 release

on:
  push:
    paths:
      - '.github/workflows/retract-v0.13.3.yml'

jobs:
  retract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the published release before rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete v0.13.3 --yes
          if gh release view v0.13.3 >/dev/null 2>&1; then
            echo 'Release still exists' >&2
            exit 1
          fi
