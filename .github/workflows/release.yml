name: Draft release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m compileall -q signal_path_analyzer native_bridge tools
      - run: python tools/build_release.py
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(python -c 'import importlib.metadata; print(importlib.metadata.version("kicad-pcb-automation-toolkit"))')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Release tag does not match project version" >&2
            exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > draft-status.txt 2>/dev/null; then
            if [[ "$(cat draft-status.txt)" != "true" ]]; then
              echo "Refusing to replace a published release" >&2
              exit 1
            fi
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
              --draft --verify-tag --title "TraceForge $VERSION" \
              --notes-file "docs/RELEASE-NOTES.md"
          fi
      - name: Record draft verification for SSH-only maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(python -c 'import importlib.metadata; print(importlib.metadata.version("kicad-pcb-automation-toolkit"))')
          gh release view "v$VERSION" --json url,isDraft,tagName,assets > release-status.json
          gh api "repos/$GH_REPO" --jq '{private: .private}' > repository-status.json
          python -c 'import json; from pathlib import Path; p=Path("release-status.json"); d=json.loads(p.read_text()); d.update(json.loads(Path("repository-status.json").read_text())); assert d["isDraft"], "Expected a draft release"; p.write_text(json.dumps(d, indent=2)+"\n")'
          python - <<'PY'
          import hashlib
          import json
          import zipfile
          from pathlib import Path
          archive = next(Path('dist').glob('*.zip'))
          with zipfile.ZipFile(archive) as bundle:
              assert bundle.testzip() is None
              manifest = {name: hashlib.sha256(bundle.read(name)).hexdigest()
                          for name in bundle.namelist()}
          status = Path('release-status.json')
          data = json.loads(status.read_text())
          data['archive_sha256'] = hashlib.sha256(archive.read_bytes()).hexdigest()
          data['package_manifest'] = manifest
          asset = next(a for a in data['assets'] if a['name'] == archive.name)
          assert asset['digest'] == 'sha256:' + data['archive_sha256']
          status.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin refs/notes/release-status:refs/notes/release-status || true
          git notes --ref=release-status add -f -F release-status.json "$GITHUB_SHA"
          git push origin refs/notes/release-status
