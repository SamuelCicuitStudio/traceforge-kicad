name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m compileall -q signal_path_analyzer native_bridge tools
      - run: python tools/verify_python_runtime.py
      - run: python tools/build_pcm.py
      - run: python tools/verify_pcm_archive.py

  publish:
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/build_pcm.py
      - run: python tools/verify_pcm_archive.py
      - name: Publish stable Windows PCM release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG="v$VERSION"
          [[ "$GITHUB_REF_NAME" == "$TAG" ]] || { echo 'Tag and package version differ' >&2; exit 1; }
          APPROVED=$(python -c 'import json; print(json.load(open("pcm/publish.json"))["tag"])')
          [[ "$APPROVED" == "$TAG" ]] || { echo 'Tag lacks publication authorization' >&2; exit 1; }
          TITLE=$(python -c 'import json; print(json.load(open("pcm/publish.json"))["title"])')
          ASSET="dist/TraceForge-$VERSION-KiCad10-PCM.zip"
          sha256sum "$ASSET" > dist/SHA256SUMS-Windows-PCM.txt

          if gh release view "$TAG" --json isDraft --jq '.isDraft' > draft.txt 2>/dev/null; then
            gh release upload "$TAG" "$ASSET" dist/SHA256SUMS-Windows-PCM.txt --clobber
          else
            gh release create "$TAG" "$ASSET" dist/SHA256SUMS-Windows-PCM.txt --draft --verify-tag \
              --title "$TITLE" --notes-file "docs/releases/$VERSION.md"
          fi

          gh release edit "$TAG" --notes-file "docs/releases/$VERSION.md" \
            --draft=false --prerelease=false --latest=true
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets
