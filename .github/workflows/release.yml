name: Draft release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m compileall -q signal_path_analyzer native_bridge tools
      - run: python tools/build_release.py
      - name: Create or update private draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(python -c 'import importlib.metadata; print(importlib.metadata.version("kicad-pcb-automation-toolkit"))')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Release tag does not match project version" >&2
            exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > draft-status.txt 2>/dev/null; then
            if [[ "$(cat draft-status.txt)" != "true" ]]; then
              echo "Refusing to replace a published release" >&2
              exit 1
            fi
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
              --draft --verify-tag --title "TraceForge $VERSION" \
              --notes-file "docs/RELEASE-NOTES-$VERSION.md"
          fi
